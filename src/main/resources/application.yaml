spring:
  application:
    name: dueldle-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/dueldle
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true